name: Documentation

# Builds the Jupyter Book in `docs/` and publishes it to GitHub Pages.
#
# - Pull requests to master: build only, to catch broken pages before merging.
# - Pushes to master (and manual runs): build and deploy.
#
# The notebooks are rendered with the outputs committed in the repository;
# nothing is executed here, so no compiler, PyTorch or ONNX Runtime is needed.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Let a running deployment finish, and queue only the most recent one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:

  build:
    runs-on: ubuntu-latest
    env:
      # The site is served from https://<owner>.github.io/<repository>/
      BASE_URL: /${{ github.event.repository.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Jupyter Book
        run: python -m pip install "jupyter-book>=2.1,<3"

      - name: Build the book
        working-directory: docs
        run: jupyter book build --html --strict

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
